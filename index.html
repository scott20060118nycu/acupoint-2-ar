<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>穴位計算-電腦主控端</title>
  
  <!-- 1. MediaPipe AI 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- 2. PeerJS 與 QRCode.js -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #121212; color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: row; overflow: hidden;
    }
    
    .display-panel {
      flex: 1; height: 100%;
      background-color: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    .status-overlay {
      position: absolute; top: 20px; left: 20px;
      padding: 10px 18px; border-radius: 20px;
      background: rgba(0,0,0,0.75); font-size: 14px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px);
      z-index: 10;
    }

    .control-panel {
      width: 320px; height: 100%;
      background-color: #1e1e1e; border-left: 1px solid #333;
      padding: 24px; display: flex; flex-direction: column;
      gap: 20px; z-index: 20;
    }
    .panel-title { font-size: 20px; font-weight: bold; color: #00FFCC; margin: 0; }
    .qrcode-box {
      background: #FFF; padding: 16px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 230px;
    }
    #qrcode img, #qrcode canvas { width: 180px !important; height: 180px !important; }
    .room-id-text { color: #000; font-weight: bold; margin-top: 10px; font-size: 16px; }

    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      font-size: 16px; font-weight: bold; cursor: pointer;
      transition: all 0.2s; outline: none;
    }
    .btn-toggle { background-color: #00FFCC; color: #000; }
    .btn-toggle:hover { background-color: #00E6B8; }
    .btn-reset { background-color: #FFCC00; color: #000; }
    .btn-reset:hover { background-color: #E6B800; }
  </style>
</head>
<body>

  <div class="display-panel">
    <div class="status-overlay" id="status_text">🔴 等待手機鏡頭連線...</div>
    <video id="remote_video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="control-panel">
    <h2 class="panel-title">電腦運算中控台</h2>
    
    <div class="qrcode-box">
      <div id="qrcode"></div>
      <div class="room-id-text" id="room_id_display">生成中...</div>
    </div>
    <p style="font-size: 12px; color: #AAA; margin: 0; text-align: center;">請用手機掃描 QR Code 開啟相機</p>

    <hr style="border: 0.5px solid #333; width: 100%;">

    <button id="btn_toggle" class="btn btn-toggle">隱藏穴位標籤</button>
    <button id="btn_reset" class="btn btn-reset">🔄 手機鏡頭刷新</button>
  </div>

  <script>
    const statusText = document.getElementById('status_text');
    const remoteVideo = document.getElementById('remote_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const roomIdDisplay = document.getElementById('room_id_display');
    const btnToggle = document.getElementById('btn_toggle');
    const btnReset = document.getElementById('btn_reset');

    let showLabels = true;
    let dataConnection = null;
    let isProcessing = false;
    let pcAnimationId = null;

    function resizeCanvas() {
      canvasElement.width = canvasElement.clientWidth * (window.devicePixelRatio || 1);
      canvasElement.height = canvasElement.clientHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 清空電腦端畫面與停止動畫運算
    function clearPCDisplay() {
      if (pcAnimationId) {
        cancelAnimationFrame(pcAnimationId);
        pcAnimationId = null;
      }

      if (remoteVideo) {
        remoteVideo.pause();
        remoteVideo.srcObject = null;
        remoteVideo.removeAttribute('src');
        remoteVideo.load();
      }

      if (canvasCtx) {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      }

      smoothedLandmarks = null;
      isProcessing = false;
      statusText.textContent = "🔴 等待手機鏡頭連線...";
    }

    // 1. 生成房號
    const roomId = 'acu-' + Math.floor(1000 + Math.random() * 9000);
    roomIdDisplay.textContent = `房號：${roomId}`;

    // 2. 自動取得同目錄下的 mobile.html 網址
    const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
    const mobileUrl = `${window.location.origin}${basePath}/mobile.html?room=${roomId}`;

    // 3. 繪製 QR Code
    function renderQRCode() {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: mobileUrl,
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.H
      });
    }
    renderQRCode();

    // 4. 初始化 PeerJS 網路連線
    const peer = new Peer(roomId);

    peer.on('open', (id) => {
      console.log('PeerJS 信號伺服器連線成功，房號:', id);
    });

    peer.on('error', (err) => {
      console.error('PeerJS 錯誤:', err);
      statusText.textContent = "⚠️ 信號伺服器連線延遲，若無法連線請重新整理";
    });

    peer.on('connection', (conn) => {
      dataConnection = conn;
      statusText.textContent = "🟡 手機已對接，等待視訊畫面...";

      conn.on('data', (data) => {
        if (data && data.type === 'STOP_STREAM') {
          clearPCDisplay();
        }
      });

      conn.on('close', clearPCDisplay);
      conn.on('error', clearPCDisplay);
    });

    peer.on('call', (call) => {
      call.answer();

      if (call.peerConnection) {
        call.peerConnection.oniceconnectionstatechange = () => {
          const state = call.peerConnection.iceConnectionState;
          if (state === 'disconnected' || state === 'failed' || state === 'closed') {
            clearPCDisplay();
          }
        };
      }

      call.on('stream', (remoteStream) => {
        statusText.textContent = "🟢 成功接收手機影像，電腦 AI 運算中...";
        remoteVideo.srcObject = remoteStream;
        remoteVideo.play();
        
        if (pcAnimationId) cancelAnimationFrame(pcAnimationId);
        processFrame();
      });

      call.on('close', clearPCDisplay);
      call.on('error', clearPCDisplay);
    });

    // 5. 全網格抗抖動平滑器
    let smoothedLandmarks = null;
    function applyFullMeshSmoothing(rawLandmarks) {
      if (!smoothedLandmarks || smoothedLandmarks.length !== rawLandmarks.length) {
        smoothedLandmarks = rawLandmarks.map(pt => ({ x: pt.x, y: pt.y, z: pt.z }));
        return smoothedLandmarks;
      }
      const alphaMin = 0.05, alphaMax = 0.88, k = 140;
      for (let i = 0; i < rawLandmarks.length; i++) {
        const raw = rawLandmarks[i], prev = smoothedLandmarks[i];
        const dx = raw.x - prev.x, dy = raw.y - prev.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dynamicAlpha = alphaMin + (alphaMax - alphaMin) * Math.exp(-k * dist);
        prev.x = dynamicAlpha * prev.x + (1 - dynamicAlpha) * raw.x;
        prev.y = dynamicAlpha * prev.y + (1 - dynamicAlpha) * raw.y;
        if (raw.z !== undefined && prev.z !== undefined) {
          prev.z = dynamicAlpha * prev.z + (1 - dynamicAlpha) * raw.z;
        }
      }
      return smoothedLandmarks;
    }

    // 6. MediaPipe AI 繪製
    function onResults(results) {
      const cw = canvasElement.width, ch = canvasElement.height;
      const dpr = window.devicePixelRatio || 1;
      
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, cw, ch);

      if (!results.image) { canvasCtx.restore(); return; }

      const vw = results.image.width, vh = results.image.height;
      const canvasAspect = cw / ch, imgAspect = vw / vh;
      let renderW, renderH, offsetX, offsetY;

      if (imgAspect > canvasAspect) {
        renderH = ch; renderW = vw * (ch / vh);
        offsetX = (cw - renderW) / 2; offsetY = 0;
      } else {
        renderW = cw; renderH = vh * (cw / vw);
        offsetX = 0; offsetY = (ch - renderH) / 2;
      }

      // 水平鏡像繪製
      canvasCtx.translate(cw, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, cw - offsetX - renderW, offsetY, renderW, renderH);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = applyFullMeshSmoothing(results.multiFaceLandmarks[0]);
          
        // 繪製 3D 臉部網格
        canvasCtx.save();
        canvasCtx.translate(cw - offsetX - renderW, offsetY);
        canvasCtx.scale(renderW / cw, renderH / ch);
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C060', lineWidth: 1.8 * dpr});
        drawConnectors(canvasCtx, landmarks, FACEMESH_CONTOURS, {color: '#00FFCCB0', lineWidth: 3.5 * dpr});
        canvasCtx.restore();

        const getPt = (idx) => ({
          x: Math.round(offsetX + landmarks[idx].x * renderW),
          y: Math.round(offsetY + landmarks[idx].y * renderH)
        });

        // 取得關鍵基準點
        const nose = getPt(1);
        const leftPupil = landmarks[468] ? getPt(468) : getPt(145);
        const rightPupil = landmarks[473] ? getPt(473) : getPt(374);
        const leftInnerCanthus = getPt(133);
        const rightInnerCanthus = getPt(362);
        const leftOuterCanthus = getPt(33);
        const rightOuterCanthus = getPt(263);

        // 🔍 轉頭角度與遮蔽判定
        const distL = Math.hypot(leftOuterCanthus.x - nose.x, leftOuterCanthus.y - nose.y);
        const distR = Math.hypot(rightOuterCanthus.x - nose.x, rightOuterCanthus.y - nose.y);
        const totalDist = distL + distR || 1;

        const ratioL = distL / totalDist;
        const ratioR = distR / totalDist;

        const showLeft = ratioL >= 0.32;
        const showRight = ratioR >= 0.32;

        // 📐 中醫同身寸動態校正演算法
        const ipdDistance = Math.hypot(rightPupil.x - leftPupil.x, rightPupil.y - leftPupil.y);
        const innerCanthusDistance = Math.hypot(rightInnerCanthus.x - leftInnerCanthus.x, rightInnerCanthus.y - leftInnerCanthus.y);
        const cunInPixels = ((ipdDistance / 3.0) + innerCanthusDistance) / 2.0;

        // 面部姿態自適應單位向量
        const dx = rightPupil.x - leftPupil.x;
        const dy = rightPupil.y - leftPupil.y;
        const len = Math.hypot(dx, dy) || 1;
        const uH = { x: dx / len, y: dy / len };
        const uV = { x: -uH.y, y: uH.x };

        const offsetByCun = (anchor, hCun, vCun) => ({
          x: Math.round(anchor.x + (hCun * uH.x + vCun * uV.x) * cunInPixels),
          y: Math.round(anchor.y + (hCun * uH.y + vCun * uV.y) * cunInPixels)
        });

        // 穴位精準位置計算
        const yintang = {
          x: Math.round((getPt(55).x + getPt(285).x) / 2),
          y: Math.round((getPt(55).y + getPt(285).y) / 2)
        };
        const qingming_L = offsetByCun(leftInnerCanthus, -0.1, -0.1);
        const qingming_R = offsetByCun(rightInnerCanthus, 0.1, -0.1);
        const zanzhu_L = { x: Math.round(getPt(55).x), y: Math.round(getPt(55).y) };
        const zanzhu_R = { x: Math.round(getPt(285).x), y: Math.round(getPt(285).y) };
        const yuyao_L = { x: Math.round(getPt(105).x), y: Math.round(getPt(105).y) };
        const yuyao_R = { x: Math.round(getPt(334).x), y: Math.round(getPt(334).y) };
        const tongzi_L = offsetByCun(leftOuterCanthus, -0.5, 0);
        const tongzi_R = offsetByCun(rightOuterCanthus, 0.5, 0);
        const sibai_L = offsetByCun(leftPupil, 0, 1.0);
        const sibai_R = offsetByCun(rightPupil, 0, 1.0);

        // 🌟 新增穴位：迎香、地倉、承漿
        const yingxiang_L = getPt(102);
        const yingxiang_R = getPt(331);
        const dicang_L = offsetByCun(getPt(61), -0.4, 0);
        const dicang_R = offsetByCun(getPt(291), 0.4, 0);
        const chengjiang = getPt(18);

        // 標籤與穴位畫點函數
        const drawPoint = (label, pt) => {
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 12 * dpr, 0, 2 * Math.PI);
          canvasCtx.fillStyle = 'rgba(255, 0, 85, 0.35)';
          canvasCtx.fill();

          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 5.5 * dpr, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#FF0055';
          canvasCtx.fill();

          canvasCtx.lineWidth = 2 * dpr;
          canvasCtx.strokeStyle = '#FFFFFF';
          canvasCtx.stroke();

          if (showLabels) {
            canvasCtx.save();
            canvasCtx.translate(pt.x, pt.y);
            canvasCtx.scale(-1, 1);

            const fontSize = Math.round(14 * dpr);
            canvasCtx.font = `bold ${fontSize}px Arial, sans-serif`;
            const textWidth = canvasCtx.measureText(label).width;
            const paddingX = 8 * dpr, paddingY = 5 * dpr, offsetY = 14 * dpr;

            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            canvasCtx.beginPath();
            canvasCtx.roundRect(-textWidth / 2 - paddingX, -fontSize - offsetY - (paddingY / 2), textWidth + (paddingX * 2), fontSize + paddingY, 5 * dpr);
            canvasCtx.fill();

            canvasCtx.fillStyle = '#00FFCC';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText(label, 0, -offsetY);
            canvasCtx.restore();
          }
        };

        // 中線穴位
        if (ratioL >= 0.22 && ratioR >= 0.22) {
          drawPoint("Yintang", yintang);
          drawPoint("Chengjiang", chengjiang);
        }

        // 左側穴位
        if (showLeft) {
          drawPoint("Qingming_L", qingming_L);
          drawPoint("Zanzhu_L", zanzhu_L);
          drawPoint("Yuyao_L", yuyao_L);
          drawPoint("Tongziliao_L", tongzi_L);
          drawPoint("Sibai_L", sibai_L);
          drawPoint("Yingxiang_L", yingxiang_L);
          drawPoint("Dicang_L", dicang_L);
        }

        // 右側穴位
        if (showRight) {
          drawPoint("Qingming_R", qingming_R);
          drawPoint("Zanzhu_R", zanzhu_R);
          drawPoint("Yuyao_R", yuyao_R);
          drawPoint("Tongziliao_R", tongzi_R);
          drawPoint("Sibai_R", sibai_R);
          drawPoint("Yingxiang_R", yingxiang_R);
          drawPoint("Dicang_R", dicang_R);
        }

      } else {
        smoothedLandmarks = null;
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.9, minTrackingConfidence: 0.9 });
    faceMesh.onResults(onResults);

    async function processFrame() {
      if (!remoteVideo.paused && !remoteVideo.ended && remoteVideo.readyState >= 2) {
        if (!isProcessing) {
          isProcessing = true;
          await faceMesh.send({ image: remoteVideo });
          isProcessing = false;
        }
      }
      pcAnimationId = requestAnimationFrame(processFrame);
    }

    btnToggle.addEventListener('click', () => {
      showLabels = !showLabels;
      btnToggle.textContent = showLabels ? "隱藏穴位標籤" : "顯示穴位標籤";
    });

    btnReset.addEventListener('click', () => {
      if (dataConnection) dataConnection.send({ type: 'RESTART_STREAM' });
    });
  </script>
</body>
</html>

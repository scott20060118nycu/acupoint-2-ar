<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>穴位計算-電腦主控端</title>
  
  <!-- 1. MediaPipe AI 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- 2. PeerJS 與 QRCode.js -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #121212; color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: row; overflow: hidden;
    }
    
    .display-panel {
      flex: 1; height: 100%;
      background-color: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    .status-overlay {
      position: absolute; top: 20px; left: 20px;
      padding: 10px 18px; border-radius: 20px;
      background: rgba(0,0,0,0.75); font-size: 14px; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px);
      z-index: 10;
    }

    .control-panel {
      width: 320px; height: 100%;
      background-color: #1e1e1e; border-left: 1px solid #333;
      padding: 24px; display: flex; flex-direction: column;
      gap: 20px; z-index: 20;
    }
    .panel-title { font-size: 20px; font-weight: bold; color: #00FFCC; margin: 0; }
    .qrcode-box {
      background: #FFF; padding: 16px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 230px;
    }
    #qrcode img, #qrcode canvas { width: 180px !important; height: 180px !important; }
    .room-id-text { color: #000; font-weight: bold; margin-top: 10px; font-size: 16px; }

    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      font-size: 16px; font-weight: bold; cursor: pointer;
      transition: all 0.2s; outline: none;
    }
    .btn-toggle { background-color: #00FFCC; color: #000; }
    .btn-toggle:hover { background-color: #00E6B8; }
    .btn-reset { background-color: #FFCC00; color: #000; }
    .btn-reset:hover { background-color: #E6B800; }
  </style>
</head>
<body>

  <div class="display-panel">
    <div class="status-overlay" id="status_text">🔴 等待手機鏡頭連線...</div>
    <video id="remote_video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="control-panel">
    <h2 class="panel-title">電腦運算中控台</h2>
    
    <div class="qrcode-box">
      <div id="qrcode"></div>
      <div class="room-id-text" id="room_id_display">生成中...</div>
    </div>
    <p style="font-size: 12px; color: #AAA; margin: 0; text-align: center;">請用手機掃描 QR Code 開啟相機</p>

    <hr style="border: 0.5px solid #333; width: 100%;">

    <button id="btn_toggle" class="btn btn-toggle">隱藏穴位標籤</button>
    <button id="btn_reset" class="btn btn-reset">🔄 手機鏡頭刷新</button>
  </div>

  <script>
    const statusText = document.getElementById('status_text');
    const remoteVideo = document.getElementById('remote_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const roomIdDisplay = document.getElementById('room_id_display');
    const btnToggle = document.getElementById('btn_toggle');
    const btnReset = document.getElementById('btn_reset');

    let showLabels = true;
    let dataConnection = null;
    let isProcessing = false;

    function resizeCanvas() {
      canvasElement.width = canvasElement.clientWidth * (window.devicePixelRatio || 1);
      canvasElement.height = canvasElement.clientHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. 生成房號
    const roomId = 'acu-' + Math.floor(1000 + Math.random() * 9000);
    roomIdDisplay.textContent = `房號：${roomId}`;

    // 2. 自動取得同目錄下的 mobile.html 網址
    const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
    const mobileUrl = `${window.location.origin}${basePath}/mobile.html?room=${roomId}`;

    // 3. 立即繪製 QR Code
    function renderQRCode() {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: mobileUrl,
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.H
      });
    }
    renderQRCode();

    // 4. 初始化 PeerJS 網路連線
    const peer = new Peer(roomId);

    peer.on('open', (id) => {
      console.log('PeerJS 信號伺服器連線成功，房號:', id);
    });

    peer.on('error', (err) => {
      console.error('PeerJS 錯誤:', err);
      statusText.textContent = "⚠️ 信號伺服器連線延遲，若無法連線請重新整理";
    });

    peer.on('connection', (conn) => {
      dataConnection = conn;
      statusText.textContent = "🟡 手機已對接，等待視訊畫面...";
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        statusText.textContent = "🟢 成功接收手機影像，電腦 AI 運算中...";
        remoteVideo.srcObject = remoteStream;
        remoteVideo.play();
        requestAnimationFrame(processFrame);
      });
    });

    // 5. 全網格抗抖動平滑器
    let smoothedLandmarks = null;
    function applyFullMeshSmoothing(rawLandmarks) {
      if (!smoothedLandmarks || smoothedLandmarks.length !== rawLandmarks.length) {
        smoothedLandmarks = rawLandmarks.map(pt => ({ x: pt.x, y: pt.y, z: pt.z }));
        return smoothedLandmarks;
      }
      const alphaMin = 0.05, alphaMax = 0.88, k = 140;
      for (let i = 0; i < rawLandmarks.length; i++) {
        const raw = rawLandmarks[i], prev = smoothedLandmarks[i];
        const dist = Math.sqrt((raw.x - prev.x)**2 + (raw.y - prev.y)**2);
        const dynamicAlpha = alphaMin + (alphaMax - alphaMin) * Math.exp(-k * dist);
        prev.x = dynamicAlpha * prev.x + (1 - dynamicAlpha) * raw.x;
        prev.y = dynamicAlpha * prev.y + (1 - dynamicAlpha) * raw.y;
      }
      return smoothedLandmarks;
    }

    // 6. MediaPipe AI 繪製
    function onResults(results) {
      const cw = canvasElement.width, ch = canvasElement.height;
      const dpr = window.devicePixelRatio || 1;
      
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, cw, ch);

      if (!results.image) { canvasCtx.restore(); return; }

      const vw = results.image.width, vh = results.image.height;
      const canvasAspect = cw / ch, imgAspect = vw / vh;
      let renderW, renderH, offsetX, offsetY;

      if (imgAspect > canvasAspect) {
        renderH = ch; renderW = vw * (ch / vh);
        offsetX = (cw - renderW) / 2; offsetY = 0;
      } else {
        renderW = cw; renderH = vh * (cw / vw);
        offsetX = 0; offsetY = (ch - renderH) / 2;
      }

      canvasCtx.translate(cw, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, cw - offsetX - renderW, offsetY, renderW, renderH);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = applyFullMeshSmoothing(results.multiFaceLandmarks[0]);
          
        canvasCtx.save();
        canvasCtx.translate(cw - offsetX - renderW, offsetY);
        canvasCtx.scale(renderW / cw, renderH / ch);
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C060', lineWidth: 1.5 * dpr});
        drawConnectors(canvasCtx, landmarks, FACEMESH_CONTOURS, {color: '#00FFCCB0', lineWidth: 3.0 * dpr});
        canvasCtx.restore();

        const getPt = (idx) => ({
          x: Math.round(offsetX + landmarks[idx].x * renderW),
          y: Math.round(offsetY + landmarks[idx].y * renderH)
        });

        const yintang = getPt(6);
        const qingming_L = getPt(133), qingming_R = getPt(362);
        const zanzhu_L = getPt(55), zanzhu_R = getPt(285);
        const yuyao_L = getPt(105), yuyao_R = getPt(334);
        const in_L = getPt(133), out_L = getPt(33);
        const tongzi_L = { x: Math.round(out_L.x + 0.35 * (out_L.x - in_L.x)), y: Math.round(out_L.y + 0.35 * (out_L.y - in_L.y)) };
        const in_R = getPt(362), out_R = getPt(263);
        const tongzi_R = { x: Math.round(out_R.x + 0.35 * (out_R.x - in_R.x)), y: Math.round(out_R.y + 0.35 * (out_R.y - in_R.y)) };
        const nose = getPt(1);
        const cL_x = (in_L.x + out_L.x) / 2, cL_y = (in_L.y + out_L.y) / 2;
        const sibai_L = { x: Math.round(cL_x), y: Math.round(cL_y + (nose.y - cL_y) * 0.45) };
        const cR_x = (in_R.x + out_R.x) / 2, cR_y = (in_R.y + out_R.y) / 2;
        const sibai_R = { x: Math.round(cR_x), y: Math.round(cR_y + (nose.y - cR_y) * 0.45) };

        const drawPoint = (label, pt) => {
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 12 * dpr, 0, 2 * Math.PI);
          canvasCtx.fillStyle = 'rgba(255, 0, 85, 0.35)';
          canvasCtx.fill();

          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 5.5 * dpr, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#FF0055';
          canvasCtx.fill();

          canvasCtx.lineWidth = 2 * dpr;
          canvasCtx.strokeStyle = '#FFFFFF';
          canvasCtx.stroke();

          if (showLabels) {
            canvasCtx.save();
            canvasCtx.translate(pt.x, pt.y);
            canvasCtx.scale(-1, 1);

            const fontSize = Math.round(14 * dpr);
            canvasCtx.font = `bold ${fontSize}px Arial, sans-serif`;
            const textWidth = canvasCtx.measureText(label).width;
            const paddingX = 8 * dpr, paddingY = 5 * dpr, offsetY = 14 * dpr;

            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            canvasCtx.beginPath();
            canvasCtx.roundRect(-textWidth / 2 - paddingX, -fontSize - offsetY - (paddingY / 2), textWidth + (paddingX * 2), fontSize + paddingY, 5 * dpr);
            canvasCtx.fill();

            canvasCtx.fillStyle = '#00FFCC';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText(label, 0, -offsetY);
            canvasCtx.restore();
          }
        };

        drawPoint("Yintang", yintang);
        drawPoint("Qingming_L", qingming_L);
        drawPoint("Qingming_R", qingming_R);
        drawPoint("Zanzhu_L", zanzhu_L);
        drawPoint("Zanzhu_R", zanzhu_R);
        drawPoint("Yuyao_L", yuyao_L);
        drawPoint("Yuyao_R", yuyao_R);
        drawPoint("Tongziliao_L", tongzi_L);
        drawPoint("Tongziliao_R", tongzi_R);
        drawPoint("Sibai_L", sibai_L);
        drawPoint("Sibai_R", sibai_R);
      } else {
        smoothedLandmarks = null;
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
    faceMesh.onResults(onResults);

    async function processFrame() {
      if (!remoteVideo.paused && !remoteVideo.ended && remoteVideo.readyState >= 2) {
        if (!isProcessing) {
          isProcessing = true;
          await faceMesh.send({ image: remoteVideo });
          isProcessing = false;
        }
      }
      requestAnimationFrame(processFrame);
    }

    btnToggle.addEventListener('click', () => {
      showLabels = !showLabels;
      btnToggle.textContent = showLabels ? "隱藏穴位標籤" : "顯示穴位標籤";
    });

    btnReset.addEventListener('click', () => {
      if (dataConnection) dataConnection.send({ type: 'RESTART_STREAM' });
    });
  </script>
</body>
</html>

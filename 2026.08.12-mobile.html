<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>手機 AR 相機傳送端</title>
  
  <!-- 僅載入輕量 WebRTC 通訊庫 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background-color: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    
    /* 顯示本地視訊畫面供使用者鏡頭對準 */
    video {
      width: 100vw; height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像顯示 */
    }

    #status_bar {
      position: absolute; top: 16px;
      padding: 8px 16px; border-radius: 20px;
      background: rgba(0,0,0,0.7); color: #00FFCC;
      font-size: 14px; font-weight: bold;
      backdrop-filter: blur(8px); z-index: 10;
    }
  </style>
</head>
<body>

  <div id="status_bar">⚡ 正在初始化相機...</div>
  <video id="local_video" playsinline autoplay muted></video>

  <script>
    const localVideo = document.getElementById('local_video');
    const statusBar = document.getElementById('status_bar');

    const urlParams = new URLSearchParams(window.location.search);
    const targetRoomId = urlParams.get('room');

    let currentStream = null;

    async function initCameraAndStream() {
      if (!targetRoomId) {
        statusBar.textContent = "❌ 請先用手機掃描電腦上的 QR Code！";
        return;
      }

      try {
        statusBar.textContent = "🎥 開啟手機鏡頭中...";
        // 抓取前鏡頭 720p 視訊串流
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        localVideo.srcObject = currentStream;

        // 建立與電腦的 Peer 通訊
        statusBar.textContent = "📡 正在連線至電腦 AI 主控台...";
        const peer = new Peer();

        peer.on('open', () => {
          // 1. 建立控制指令通道
          const conn = peer.connect(targetRoomId);
          conn.on('open', () => {
            statusBar.textContent = "🟢 相機串流傳輸中 (電腦 AI 運算中)";
          });

          conn.on('data', (data) => {
            if (data.type === 'RESTART_STREAM') {
              window.location.reload();
            }
          });

          // 2. 將原始影像串流直接推送到電腦端
          peer.call(targetRoomId, currentStream);
        });

      } catch (err) {
        console.error("手機相機或串流錯誤:", err);
        statusBar.textContent = "❌ 相機存取失敗，請確認已授權權限！";
      }
    }

    initCameraAndStream();
  </script>
</body>
</html>

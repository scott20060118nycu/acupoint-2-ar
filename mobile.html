<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>手機 AR 相機傳送端</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background-color: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    video {
      width: 100vw; height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #status_bar {
      position: absolute; top: 20px;
      padding: 8px 18px; border-radius: 20px;
      background: rgba(0,0,0,0.75); color: #00FFCC;
      font-size: 14px; font-weight: bold;
      backdrop-filter: blur(8px); z-index: 10;
      border: 1px solid rgba(0, 255, 204, 0.3);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="status_bar">⚡ 正在初始化相機...</div>
  <video id="local_video" playsinline autoplay muted></video>

  <script>
    const localVideo = document.getElementById('local_video');
    const statusBar = document.getElementById('status_bar');

    const urlParams = new URLSearchParams(window.location.search);
    const targetRoomId = urlParams.get('room');

    let currentStream = null;

    async function initCameraAndStream() {
      if (!targetRoomId) {
        statusBar.style.color = '#FF5555';
        statusBar.style.borderColor = 'rgba(255, 85, 85, 0.5)';
        statusBar.textContent = "❌ 缺少房間碼，請重新掃描電腦上的 QR Code！";
        return;
      }

      try {
        statusBar.textContent = "🎥 開啟手機鏡頭中...";
        
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        localVideo.srcObject = currentStream;

        statusBar.textContent = "📡 正在連線至電腦 AI 主控台...";
        const peer = new Peer();

        peer.on('open', () => {
          const conn = peer.connect(targetRoomId);

          conn.on('open', () => {
            statusBar.style.color = '#00FFCC';
            statusBar.style.borderColor = 'rgba(0, 255, 204, 0.5)';
            statusBar.textContent = "🟢 畫面串流中（電腦 AI 運算中）";
          });

          conn.on('data', (data) => {
            if (data.type === 'RESTART_STREAM') {
              statusBar.textContent = "🔄 接收到電腦要求，重新整理中...";
              window.location.reload();
            }
          });

          peer.call(targetRoomId, currentStream);
        });

        peer.on('error', (err) => {
          console.error("PeerJS 連線錯誤:", err);
          statusBar.style.color = '#FFCC00';
          statusBar.style.borderColor = 'rgba(255, 204, 0, 0.5)';
          statusBar.textContent = "⚠️ 連線異常，請重新掃碼或整理頁面";
        });

      } catch (err) {
        console.error("手機相機開啟失敗:", err);
        statusBar.style.color = '#FF5555';
        statusBar.style.borderColor = 'rgba(255, 85, 85, 0.5)';
        statusBar.textContent = "❌ 相機開啟失敗，請確認允許相機存取權限！";
      }
    }

    initCameraAndStream();
  </script>
</body>
</html>
